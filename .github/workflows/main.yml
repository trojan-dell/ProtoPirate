name: Build ProtoPirate FAP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Отримати код
        uses: actions/checkout@v4

      - name: Встановити Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Встановити uFBT
        run: pip install ufbt

      - name: Показати вміст перед збіркою (для діагностики)
        run: ls -laR

      - name: Зібрати .fap
        run: ufbt build

      - name: Показати вміст після збірки
        run: |
          echo "=== Вміст поточної папки ==="
          ls -la
          echo "=== Вміст усіх підпапок (з .fap) ==="
          find . -name "*.fap" -type f
          echo "=== Вміст усіх підпапок (з .elf) ==="
          find . -name "*.elf" -type f
          echo "=== Вміст усіх підпапок (з .out) ==="
          find . -name "*.out" -type f

      - name: Завантажити артефакт (якщо знайдеться)
        uses: actions/upload-artifact@v4
        with:
          name: protopirate-build
          path: "**/*"   # завантажимо ВСІ файли, щоб побачити, що там є
