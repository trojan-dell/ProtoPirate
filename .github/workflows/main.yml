name: Build ProtoPirate FAP

on:
  workflow_dispatch:   # запуск вручну з вкладки Actions

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Отримати код
        uses: actions/checkout@v4

      - name: Встановити Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Встановити uFBT
        run: pip install ufbt

      - name: Зібрати .fap
        run: ufbt build

      - name: Завантажити артефакт
        uses: actions/upload-artifact@v4
        with:
          name: protopirate-fap
          path: dist/*.fap   # uFBT кладе зібраний файл сюди
